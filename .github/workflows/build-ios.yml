name: 編譯 iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 顯示 Xcode 版本
        run: xcodebuild -version

      - name: 安裝 XcodeGen
        run: brew install xcodegen

      - name: 下載 whisper.xcframework
        env:
          # 較新的 whisper.cpp 版本沒有附 xcframework，固定使用有附的版本
          WHISPER_VERSION: v1.9.2
        run: |
          curl -fsSL -o whisper.zip "https://github.com/ggml-org/whisper.cpp/releases/download/${WHISPER_VERSION}/whisper-${WHISPER_VERSION}-xcframework.zip"
          unzip -q whisper.zip -d _whisper
          FRAMEWORK=$(find _whisper -name whisper.xcframework -type d -prune | head -n 1)
          test -n "$FRAMEWORK"
          mkdir -p Frameworks
          mv "$FRAMEWORK" Frameworks/

      - name: 產生 Xcode 專案
        run: xcodegen

      - name: 編譯（不簽署）
        run: |
          set -o pipefail
          xcodebuild build \
            -project VoiceNote.xcodeproj \
            -scheme VoiceNote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build.log

      - name: 整理編譯錯誤
        if: failure()
        run: |
          test -f build.log || exit 0
          ERRORS=$(grep -E "(error|fatal error):" build.log | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -60)
          [ -z "$ERRORS" ] && ERRORS=$(tail -40 build.log)
          ERRORS="${ERRORS//'%'/'%25'}"
          ERRORS="${ERRORS//$'\n'/'%0A'}"
          echo "::error title=編譯錯誤::$ERRORS"

      - name: 打包成 IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/VoiceNote.app Payload/
          # 確認 whisper 框架有被打包進 App，否則一打開就會閃退
          test -f Payload/VoiceNote.app/Frameworks/whisper.framework/whisper
          zip -qry VoiceNote.ipa Payload
          echo "::notice title=App 內容::$(cd Payload/VoiceNote.app && du -sh . Frameworks/* VoiceNote | tr '\n' ';')"

      - name: 上傳 IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoiceNote-ipa
          path: VoiceNote.ipa
          retention-days: 30
